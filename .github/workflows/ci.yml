# Stage 10 — Orchestrator CI & Quality Gates
# Verifies: pipeline contract, routing, validation, presentation, explainability.
# Fails on: orchestrator test failure, routing/validation/presentation/explainability regression.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  PYTHONHASHSEED: "0"

jobs:
  orchestrator-ci:
    name: Orchestrator & quality gates
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest hypothesis pytest-cov

      - name: Run orchestrator integration tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/orchestrator -q -ra
        continue-on-error: false

      - name: Run core engine smoke tests (if present)
        env:
          PYTHONPATH: src
        run: |
          if [ -d tests/engines ]; then pytest tests/engines -q -ra || true; else echo "tests/engines not found, skipping"; fi

      - name: Generate coverage report
        env:
          PYTHONPATH: src
        run: |
          pytest tests/orchestrator --cov=src --cov-report=xml --cov-report=term-missing -q
        continue-on-error: true

      - name: Pytest summary
        if: always()
        run: |
          echo "Orchestrator CI job completed. Check previous step output for any failures."

  # Phase 0.5 — Arabic algebra governance gate.
  # Locks the constitution merged in PR #35 (src/fvafk/algebra):
  #   - rank/evidence/residual/failure invariants ("لا مخرج عارٍ"),
  #   - ALLOWED_BRIDGES / FORBIDDEN_BRIDGES topology,
  #   - CPB correspondence (no uncited outputs).
  # Any future PR that breaks one of these will fail this job.
  algebra-governance:
    name: Arabic algebra governance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run algebra governance tests (matrix + invariants + CPB)
        env:
          PYTHONPATH: src
        run: |
          pytest tests/fvafk/algebra -q -ra

      - name: Run legacy algebra tests (regression guard)
        env:
          PYTHONPATH: src
        run: |
          pytest tests/test_algebra_cpb.py tests/test_algebra_decision_tree.py tests/test_algebra_code_learning.py -q -ra

  # Phase A.1 — Architectural Admission Governance
  # Enforces Minimal Sufficiency Constitution (PR #79)
  # Blocks PRs that:
  #   - Add new constructs without MinimalSufficiencyCheck
  #   - Add useful-but-not-necessary constructs
  #   - Lack reduction attempts or risk mitigation
  architectural-admission:
    name: Architectural admission governance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run architectural admission checker tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/tools/test_architectural_admission.py -q -ra

      - name: Info - Architectural admission enforced
        run: |
          echo "✅ Architectural admission governance tests passed"
          echo "Constitution: docs/MINIMAL_SUFFICIENCY_CONSTITUTION.md"
          echo "Schema: docs/ARCHITECTURAL_ADMISSION_SCHEMA.md"

  # Phase P.1 — Prior Information Geometry Governance
  # Enforces Prior Information System laws (PR #79)
  # Critical gates:
  #   - PriorInformationGate (domain + source + evidence/testability)
  #   - PriorOpinionFilter (blocks opinion contamination)
  #   - NameRealitySubGate (prevents name→reality usurpation)
  prior-information-governance:
    name: Prior information geometry governance
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest

      - name: Run prior information gate tests
        env:
          PYTHONPATH: src
        run: |
          pytest tests/gfa/prior_information/ -q -ra

      - name: Info - Prior information geometry enforced
        run: |
          echo "✅ Prior information geometry governance tests passed"
          echo "Critical laws enforced:"
          echo "  1. Prior information requires domain + source + (evidence OR testability)"
          echo "  2. Prior opinion is blocked"
          echo "  3. Name→reality requires referent + domain + evidence"
          echo "  4. Reality types require proper domain scoping"

  # Existing Coq skeleton job (optional; does not block orchestrator pass)
  coq-skeleton:
    name: Coq skeleton
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Coq
        run: |
          sudo apt-get update
          sudo apt-get install -y coq

      - name: Compile Coq skeletons
        run: |
          coqc coq/Gates/GateSukun.v
          coqc coq/Gates/GateShadda.v
          coqc coq/Gates/GateTanwin.v
